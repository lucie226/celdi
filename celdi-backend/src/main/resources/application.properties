spring.application.name=crm
server.port=8080
server.error.include-message=always
spring.datasource.url=jdbc:mysql://localhost:3306/${DB_NAME:celdi}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:123}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
jwt.secret=${JWT_SECRET:change-moi-par-un-long-secret-aleatoire-32-caracteres-minimum}
jwt.expiration-ms=86400000
app.cors.allowed-origins=http://localhost:4200,http://localhost:3000,http://localhost:5173
app.bootstrap-admin.enabled=true
app.bootstrap-admin.nom=Administrateur
app.bootstrap-admin.email=admin@crm.com
app.bootstrap-admin.password=Admin123!
