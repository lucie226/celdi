<aside class="sidebar" [class.collapsed]="sidebarCollapsed">
  <div class="logo-container" (click)="basculer()" title="Réduire / agrandir le menu">
    <img src="assets/logo%20(2).png" alt="celdi-logo" class="logo-img">
  </div>

  <span class="trait"></span>

  <nav class="menu">
    <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">
      <lucide-icon [img]="LayoutDashboard"></lucide-icon>
      <span>Tableau de bord</span>
    </a>
    <a routerLink="/prospects" routerLinkActive="active" class="nav-item">
      <lucide-icon [img]="BarChart3"></lucide-icon>
      <span>Prospects</span>
    </a>
    @if (peutVoirUtilisateurs) {
      <a routerLink="/utilisateur" routerLinkActive="active" class="nav-item">
        <lucide-icon [img]="Users"></lucide-icon>
        <span>Utilisateurs</span>
      </a>
    }
    <a routerLink="/statistiques" routerLinkActive="active" class="nav-item">
      <lucide-icon [img]="BarChart3"></lucide-icon>
      <span>Statistiques</span>
    </a>
  </nav>

  <span class="trait"></span>

  <div class="logout-container">
    <button class="logout-btn" (click)="onLogout()">
      <lucide-icon [img]="LogOut"></lucide-icon>
      <span>Déconnexion</span>
    </button>
  </div>
</aside>
